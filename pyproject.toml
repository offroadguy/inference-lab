[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "inference-lab"
version = "0.1.0"
description = "A local-first, approval-gated GPU inference experiment lab"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "modal==1.6.3",
  "streamlit==1.51.0",
  "pandas==2.3.3",
  "plotly==6.4.0",
  "python-dotenv==1.2.1",
  "fastapi==0.121.0",
  "uvicorn==0.38.0",
  "prometheus-client==0.23.1",
  "tokenizers==0.22.1",
  "huggingface-hub==1.33.0",
]

[project.scripts]
inference-lab = "inference_lab.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
